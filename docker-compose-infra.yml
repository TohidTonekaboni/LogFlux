
x-mem-limit: &mem-limit
  deploy:
    resources:
      limits:
        memory: 2G

networks:
  log_flux_net:
    driver: bridge

volumes:
  es_data_log_flux:
  kafka_1_data:
  kafka_2_data:
services:
  # ---------------------------------------------------------------------------
  # ELK 
  # xpack security is ON (auth required) but TLS is left off for local/dev
  # simplicity — add TLS before using this stack anywhere reachable outside a
  # trusted network. 
  # ---------------------------------------------------------------------------
  elasticsearch:
    <<: *mem-limit
    image: elastic/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    volumes:
      - es_data_log_flux:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - log_flux_net

  # One-shot job: sets the kibana_system password and creates the 'ai_fashion'
  # login (superuser role — this is a single-tenant dev/admin account, same
  # broad-access pattern as POSTGRES_USER/MINIO_ROOT_USER in this stack; scope
  # it down to a custom role before sharing this environment).
  es-setup:
    <<: *mem-limit
    image: curlimages/curl:8.10.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      ES_USER: ${ES_USER}
      ES_PASSWORD: ${ES_PASSWORD}
    volumes:
      - ./infra/elk/es-setup/es-setup.sh:/es-setup.sh:ro
    entrypoint: ["/bin/sh", "/es-setup.sh"]
    networks:
      - log_flux_net

  logstash:
    <<: *mem-limit
    image: elastic/logstash:8.15.0
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: ${LOGSTASH_JAVA_OPTS}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./infra/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./infra/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - log_flux_net

  kibana:
    <<: *mem-limit
    image: elastic/kibana:8.15.0
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully
    networks:
      - log_flux_net

  filebeat:
    <<: *mem-limit
    image: elastic/filebeat:8.15.0
    restart: unless-stopped
    user: root
    # --strict.perms=false: bind-mounted config files fail Filebeat's ownership
    # check in dev; for prod, bake filebeat.yml into a custom image (root:600) instead.
    # -e: log to stderr so `docker logs`/`docker compose logs` show output —
    # this command overrides the image's default CMD, which otherwise enables it.
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./infra/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - log_flux_net

  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode, no ZooKeeper) — 2 nodes, each running combined
  # broker+controller roles.
  # Note: with only 2 controller voters, quorum = both nodes, so this cluster
  # has no controller fault tolerance (losing either node halts metadata
  # writes). Fine for local/dev; use 3+ odd voters for real HA.
  # ---------------------------------------------------------------------------
  kafka-1:
    <<: *mem-limit
    image: apache/kafka:3.9.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Defaults (3) exceed this cluster's broker count and would leave
      # __consumer_offsets (and any auto-created topic) stuck retrying
      # creation forever.
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - log_flux_net

  kafka-2:
    <<: *mem-limit
    image: apache/kafka:3.9.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Defaults (3) exceed this cluster's broker count and would leave
      # __consumer_offsets (and any auto-created topic) stuck retrying
      # creation forever.
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    ports:
      - "9095:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - log_flux_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: log-flux
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092
    ports:
      - "8080:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    networks:
      - log_flux_net