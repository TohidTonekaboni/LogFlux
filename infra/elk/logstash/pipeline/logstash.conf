input {
  beats {
    port => 5044
  }
}

filter {
  # Go (zerolog/zap) and Python (structlog) services log structured JSON to stdout
  # (documents/backend.md §6) — Filebeat ships the raw line, parse it back to fields here.
  if [message] =~ /^\s*\{.*\}\s*$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "flux-logs-%{+YYYY.MM.dd}"
    # Security is enabled on Elasticsearch (see docker-compose.yml) — write as
    # the built-in superuser for simplicity; scope to a dedicated 'logstash_writer'
    # role before this is shared beyond local dev.
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
}
