global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]

  # ingestion/consumer/api are containerized (docker-compose.yml, Phase 6)
  # and share this compose network, so they're reachable by service name.
  - job_name: logflux-ingestion
    static_configs:
      - targets: ["ingestion:2112"]

  - job_name: logflux-consumer
    static_configs:
      - targets: ["consumer:2113"]

  - job_name: logflux-api
    static_configs:
      - targets: ["api:8081"]
